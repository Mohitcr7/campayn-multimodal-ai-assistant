# Redis holds conversation history (1h TTL) and the intent-parse cache (24h TTL).
# Both are disposable by design: losing them costs follow-up context and some
# cache hits, never correctness. So this is a plain Deployment with ephemeral
# storage — no PVC. Durable state lives in Postgres.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: campayn
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: campayn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # maxmemory + LRU eviction: the cache can never grow without bound,
          # which is exactly the failure mode MemorySaver had in-process.
          args:
            - redis-server
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "320Mi"
              cpu: "250m"
