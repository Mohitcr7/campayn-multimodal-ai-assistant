# ─────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — DO NOT PUT REAL KEYS IN THIS FILE.
#
# This file is committed to git. Real API keys must never be.
# Create the actual Secret straight from your local .env instead:
#
#   kubectl create secret generic campayn-secret \
#     --namespace campayn \
#     --from-env-file=.env
#
# That reads the same .env the app uses locally and never writes the
# values to disk in the repo. To rotate a key, delete and recreate:
#
#   kubectl delete secret campayn-secret -n campayn
#   kubectl create secret generic campayn-secret -n campayn --from-env-file=.env
#   kubectl rollout restart deployment/campayn-api -n campayn
#
# Note: Kubernetes Secrets are base64-encoded, NOT encrypted. Anyone with
# read access to the namespace can decode them. For real production use
# sealed-secrets, External Secrets Operator, or a cloud secret manager.
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: campayn-secret
  namespace: campayn
type: Opaque
stringData:
  GEMINI_API_KEY:     "replace-me"
  OPENROUTER_API_KEY: "replace-me"
  ANTHROPIC_API_KEY:  "replace-me"
  LANGCHAIN_API_KEY:  "replace-me"
